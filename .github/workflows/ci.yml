name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff
        run: |
          ruff check .
      - name: Run pytest
        run: |
          pytest -m "not e2e"

  # Full upstream parity suite (issue #17 / #75): builds the image with both
  # tools and compares their documented Phase-1 surfaces in Docker.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build parity image
        run: |
          docker build -f docker/parity/Dockerfile -t zai-parity:smoke .
      - name: Run full upstream parity suite
        # The test auto-detects docker via `_docker_available()`; no env hint
        # is needed. The image built above is reused (not rebuilt) because the
        # test's `_ensure_image()` sees it already present.
        run: |
          ZAI_PARITY_STRICT=1 pytest tests/parity/ -v
