name: Docs

# Issue #19 — machine-readable, auto-generated documentation (FastAPI-style).
# The code (docstrings + type hints) is the source of truth; docs/api/*.md and
# llms.txt are derivatives regenerated by `tools/gen_docs.py`. This workflow
# enforces that invariant: after regenerating from the current code, the
# checked-in artifacts must be unchanged. A stale `docs/` or `llms.txt` (code
# changed, docs not rebuilt) fails the build.
#
# The docs tests (tests/test_docs_gen.py) run in the main CI matrix when the
# `docs` extra is installed; this job is the dedicated sync gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    name: docs in sync with code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev + docs extras
        # dev = ruff (lints the generator); docs = griffe (runs it).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
      - name: Lint the generator
        run: ruff check tools/gen_docs.py
      # Regenerate from the current code, then fail if anything on disk would
      # change — i.e. the committed artifacts are out of sync.
      - name: Regenerate docs
        run: make docs
      - name: Verify docs are in sync
        run: |
          if ! git diff --exit-code docs/ llms.txt; then
            echo "::error::Docs are stale. Run 'make docs' and commit docs/ + llms.txt."
            exit 1
          fi
      - name: Run docs tests
        run: pytest tests/test_docs_gen.py -v
